name: Preflight test (publishes nothing)

on:
  workflow_dispatch:
    inputs:
      next:
        description: "Test the next N items (0 = one of each type)"
        default: "0"

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - run: python scripts/preflight.py --next "${{ inputs.next }}"
