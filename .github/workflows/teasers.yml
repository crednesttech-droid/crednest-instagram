name: Teaser stories (weekly)

# Every Monday 08:10 IST: a story card 20 min after each feed post in the next 21 days.
on:
  schedule:
    - cron: "40 2 * * 1"
  workflow_dispatch:

concurrency:
  group: instagram-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  teasers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - run: python scripts/make_teasers.py && python scripts/publish.py --check
      - run: |
          git config user.name "crednest-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add -A media queue.json
          git diff --cached --quiet && exit 0
          git commit -m "Teaser stories: next 21 days"
          for i in 1 2 3; do git pull --rebase --quiet origin main && git push && exit 0; sleep 5; done; exit 1
