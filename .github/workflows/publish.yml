name: Instagram autopilot

on:
  # Primary trigger: an external 15-min ping (Hostinger cron -> repository_dispatch "publish-tick").
  # GitHub's own cron is only a fallback: on 1-17 Nov it fired ~4 times a day instead of 96,
  # which is why posts went out 2-7 h late.
  repository_dispatch:
    types: [publish-tick]
  schedule:
    - cron: "7,22,37,52 * * * *"   # fallback only (UTC); GitHub may delay or drop these
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (show what would post, publish nothing)"
        type: boolean
        default: true
      only:
        description: "Publish one item id now (optional)"
        required: false

concurrency:
  group: instagram-publish
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
      ALERTS_FILE: /tmp/autopilot-alerts.txt
      INBOX_FILE: /tmp/autopilot-inbox.txt
      STATUS_FILE: /tmp/autopilot-status.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - run: python scripts/publish.py --check
      - name: Stop if secrets are missing
        id: gate
        run: |
          if [ -z "$IG_USER_ID" ] || [ -z "$IG_ACCESS_TOKEN" ]; then
            echo "Secrets IG_USER_ID / IG_ACCESS_TOKEN not set yet. Nothing published."; echo "go=no" >> $GITHUB_OUTPUT
          else echo "go=yes" >> $GITHUB_OUTPUT; fi
      - name: Dry run
        if: steps.gate.outputs.go == 'yes' && github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: python scripts/publish.py --dry-run
      - name: Publish
        if: steps.gate.outputs.go == 'yes' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: |
          if [ -n "${{ inputs.only }}" ]; then python scripts/publish.py --only "${{ inputs.only }}"; else python scripts/publish.py; fi
      - name: Auto-reply comments and DMs (keyword -> checklist DM, question -> WhatsApp DM, rest -> thanks)
        if: steps.gate.outputs.go == 'yes' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        continue-on-error: true
        run: python scripts/engage.py
      - name: Cross-post to the Facebook Page
        if: steps.gate.outputs.go == 'yes' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        continue-on-error: true
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: |
          if [ -z "$FB_PAGE_TOKEN" ]; then echo "FB_PAGE_TOKEN not set; Facebook skipped."; else python scripts/fb_publish.py; fi
      - name: Save published state (retry so a concurrent merge can't lose it -> no double posts)
        if: always()
        run: |
          git config user.name "crednest-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add state/*.json queue.json
          git diff --cached --quiet && exit 0
          git commit -m "Published: $(date -u +%FT%TZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase --quiet origin main && git push && exit 0
            echo "push attempt $i failed, retrying"; sleep $((i * 5))
          done
          echo "STATE NOT SAVED: could not push state after 5 tries" | tee -a "$ALERTS_FILE"; exit 1
      - name: Alert (GitHub issue -> email) on failure, late, missed or blocked duplicate
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          [ "$JOB_STATUS" != "success" ] && echo "RUN $JOB_STATUS" >> "$ALERTS_FILE"
          [ -s "$ALERTS_FILE" ] || exit 0
          body="$(date -u -d '+5 hours 30 minutes' '+%d %b %H:%M IST')"$'\n\n'"$(cat "$ALERTS_FILE")"$'\n\n'"Run: $RUN_URL"
          n=$(gh issue list --label autopilot-alert --state open --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"
          else
            gh label create autopilot-alert --color B60205 2>/dev/null || true
            gh issue create --title "Autopilot alert" --label autopilot-alert --body "$body"
          fi
      - name: Notify Amrut (Inbox items + WhatsApp Status kit as GitHub issue comments -> email/app push)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          post() {  # $1 file, $2 label, $3 title
            [ -s "$1" ] || return 0
            n=$(gh issue list --label "$2" --state open --json number --jq '.[0].number')
            if [ -z "$n" ]; then gh label create "$2" --color 0E8A16 2>/dev/null || true
              gh issue create --title "$3" --label "$2" --body "$(cat "$1")"
            else gh issue comment "$n" --body "$(cat "$1")"; fi
          }
          post "$INBOX_FILE" inbox "Inbox: comments and DMs that need Amrut"
          post "$STATUS_FILE" whatsapp-status "WhatsApp Status kit (share each new post)"
