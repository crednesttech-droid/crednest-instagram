name: Instagram autopilot

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 min; posts go out at or shortly after their IST time
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (show what would post, publish nothing)"
        type: boolean
        default: true
      only:
        description: "Publish one item id now (optional)"
        required: false

concurrency:
  group: instagram-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - run: python scripts/publish.py --check
      - name: Stop if secrets are missing
        id: gate
        run: |
          if [ -z "$IG_USER_ID" ] || [ -z "$IG_ACCESS_TOKEN" ]; then
            echo "Secrets IG_USER_ID / IG_ACCESS_TOKEN not set yet. Nothing published."; echo "go=no" >> $GITHUB_OUTPUT
          else echo "go=yes" >> $GITHUB_OUTPUT; fi
      - name: Dry run
        if: steps.gate.outputs.go == 'yes' && github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: python scripts/publish.py --dry-run
      - name: Publish
        if: steps.gate.outputs.go == 'yes' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: |
          if [ -n "${{ inputs.only }}" ]; then python scripts/publish.py --only "${{ inputs.only }}"; else python scripts/publish.py; fi
      - name: Save published state
        if: always()
        run: |
          git config user.name "crednest-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add state/published.json
          git diff --cached --quiet || (git commit -m "Published: $(date -u +%FT%TZ)" && git push)
