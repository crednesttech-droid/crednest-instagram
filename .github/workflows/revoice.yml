name: Re-voice reels (Sarvam)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "voice = new Sarvam voice + music (reels waiting for voice); music-only = add music to current voice, no Sarvam cost"
        type: choice
        options: [voice, music-only]
        default: voice
      speaker:
        description: "Sarvam speaker (e.g. aditya, rahul, rohan, priya, neha)"
        default: "aditya"
      model:
        description: "Sarvam model (bulbul:v3 or bulbul:v4-flash)"
        default: "bulbul:v3"
      only:
        description: "One reel id (blank = all reels for this mode)"
        required: false

concurrency:
  group: instagram-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  revoice:
    runs-on: ubuntu-latest
    env:
      SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install numpy
      - name: Voice and music
        run: |
          ARGS=""
          if [ "${{ inputs.mode }}" = "music-only" ]; then ARGS="--music-only --all"; fi
          if [ -n "${{ inputs.only }}" ]; then ARGS="$ARGS --only ${{ inputs.only }}"; fi
          python scripts/revoice.py --speaker "${{ inputs.speaker }}" --model "${{ inputs.model }}" $ARGS
      - uses: actions/upload-artifact@v4
        with:
          name: revoiced-reels
          path: media/*/reel.mp4
      - run: |
          git config user.name "crednest-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add -A media queue.json
          git diff --cached --quiet || (git commit -m "Reels audio: ${{ inputs.mode }} (${{ inputs.speaker }})" && git push)
