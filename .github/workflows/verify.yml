name: Verify Instagram connection

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
    steps:
      - name: Check token and user id (read-only, posts nothing)
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse, sys
          tok = os.environ["IG_ACCESS_TOKEN"].strip(); uid = os.environ["IG_USER_ID"].strip()
          q = urllib.parse.urlencode({"fields": "user_id,username,account_type", "access_token": tok})
          try:
              with urllib.request.urlopen(f"https://graph.instagram.com/v23.0/me?{q}", timeout=30) as r:
                  me = json.load(r)
          except urllib.error.HTTPError as e:
              print("TOKEN ERROR:", e.code, e.read().decode()[:300]); sys.exit(1)
          print("Username:", me.get("username"), "| type:", me.get("account_type"))
          ok = str(me.get("user_id")) == uid or str(me.get("id")) == uid
          print("IG_USER_ID matches token:", ok)
          sys.exit(0 if ok else 1)
          PY
      - name: Check comment and DM permissions (read-only, posts nothing)
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          tok = os.environ["IG_ACCESS_TOKEN"].strip(); uid = os.environ["IG_USER_ID"].strip()
          def get(path, **p):
              p["access_token"] = tok
              try:
                  with urllib.request.urlopen(f"https://graph.instagram.com/v23.0/{path}?{urllib.parse.urlencode(p)}", timeout=30) as r:
                      return True, json.load(r)
              except urllib.error.HTTPError as e:
                  return False, e.read().decode()[:300]
          ok, media = get(f"{uid}/media", fields="id", limit=1)
          mid = media["data"][0]["id"] if ok and media.get("data") else None
          ok_c, res_c = get(f"{mid}/comments", fields="id,text", limit=1) if mid else (False, "no media")
          print("COMMENTS read (instagram_business_manage_comments):", "OK" if ok_c else f"FAIL {res_c}")
          ok_d, res_d = get("me/conversations", platform="instagram", fields="id", limit=1)
          print("DMs read (instagram_business_manage_messages):", "OK" if ok_d else f"FAIL {res_d}")
          if ok_d: print("  conversations visible:", len(res_d.get("data", [])))
          PY
      - name: Comment visibility per recent post (counts only, no names or text)
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          tok = os.environ["IG_ACCESS_TOKEN"].strip(); uid = os.environ["IG_USER_ID"].strip()
          def get(path, **p):
              p["access_token"] = tok
              try:
                  with urllib.request.urlopen(f"https://graph.instagram.com/v23.0/{path}?{urllib.parse.urlencode(p)}", timeout=30) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  return {"error": e.read().decode()[:200]}
          media = get(f"{uid}/media", fields="id,timestamp,comments_count,media_type", limit=8).get("data", [])
          for m in media:
              c = get(f"{m['id']}/comments", fields="id,timestamp", limit=50)
              print(m["timestamp"][:16], m["media_type"], "comments_count:", m.get("comments_count"),
                    "| API comments:", len(c.get("data", [])) if "data" in c else c)
          PY
