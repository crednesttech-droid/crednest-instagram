<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img"><title>05 Service Spotlight</title><desc>CredNest brand kit v1. Editable text; install bundled Manrope fonts. Logo is an embedded original PNG.</desc><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#F8F8F4" stroke="none" stroke-width="1"/><image x="88" y="88" width="72" height="72" href="data:image/png;base64,"/><text x="180" y="135.86" fill="#07150F" font-family="Manrope, Segoe UI, Arial, sans-serif" font-weight="800" font-size="42">CredNest</text><text x="88" y="234.43" fill="#315746" font-family="Manrope, Segoe UI, Arial, sans-serif" font-weight="700" font-size="21">CAPITAL SOLUTIONS  /  WORKING CAPITAL</text><text x="88" y="368.36" fill="#07150F" font-family="Manrope, Segoe UI, Arial, sans-serif" font-weight="800" font-size="92">Inventory today.</text><text x="88" y="467.72" fill="#07150F" font-family="Manrope, Segoe UI, Arial, sans-serif" font-weight="800" font-size="92">Customer</text><text x="88" y="567.08" fill="#07150F" font-family="Manrope, Segoe UI, Arial, sans-serif" font-weight="800" font-size="92">payments later.</text><text x="88" y="689.39" fill="#315746" font-family="Manrope, Segoe UI, Arial, sans-serif" font-weight="400" font-size="33">Start with the cash-flow timing.</text><text x="88" y="733.61" fill="#315746" font-family="Manrope, Segoe UI, Arial, sans-serif" font-weight="400" font-size="33">Then discuss the financing structure.</text><rect x="88" y="820" width="904" height="238" rx="24" fill="#0D2119" stroke="none" stroke-width="1"/><text x="124" y="871.43" fill="#B8FF5A" font-family="Manrope, Segoe UI, Arial, sans-serif" font-weight="700" font-size="21">A CLEARER REQUIREMENT</text><text x="124" y="932.71" fill="#F8F8F4" font-family="Manrope, Segoe UI, Arial, sans-serif" font-weight="700" font-size="37">Use of funds</text><text x="124" y="979.41" fill="#BCCDC4" font-family="Manrope, Segoe UI, Arial, sans-serif" font-weight="400" font-size="27">Operating cycle  /  Repayment context</text><text x="88" y="1151.9" fill="#07150F" font-family="Manrope, Segoe UI, Arial, sans-serif" font-weight="700" font-size="30">Discuss your business requirement.</text><line x1="88" y1="1220" x2="992" y2="1220" stroke="#D9E0D9" stroke-width="2"/><text x="88" y="1268.75" fill="#07150F" font-family="Manrope, Segoe UI, Arial, sans-serif" font-weight="700" font-size="25">crednest.io</text><text x="88" y="1307.94" fill="#53615A" font-family="Manrope, Segoe UI, Arial, sans-serif" font-weight="400" font-size="18">CredNest facilitates debt capital. Financing is subject to independent</text><text x="88" y="1330.44" fill="#53615A" font-family="Manrope, Segoe UI, Arial, sans-serif" font-weight="400" font-size="18">lender assessment, documentation and approval.</text></svg>